    // VIEW 3: ELECTRONICS & CHARGERS
    function renderElectronicsView(container) {
      const trip = getActiveTrip();
      const allItems = getTripChecklistItems(trip);
      const devices = getTrackedDevices(trip);

      const mirrorItem = devices.find(d => d.id === 'base-85');
      const showMirrorAlert = !store.dismissedMirrorNote && mirrorItem && mirrorItem.charger === 'Android USB';

      const byCharger = new Map();
      devices.forEach(d => {
        const key = (d.charger || '???').trim();
        const bringing = d.status !== "Don't Need";
        if (!byCharger.has(key)) byCharger.set(key, { active: [], skipped: [] });
        if (bringing) byCharger.get(key).active.push(d);
        else byCharger.get(key).skipped.push(d);
      });

      const chargerEntries = Array.from(byCharger.entries()).sort((a, b) => {
        if (a[0] === '???') return -1;
        if (b[0] === '???') return 1;
        return b[1].active.length - a[1].active.length;
      });

      container.innerHTML = `
        <div class="stack">
          ${showMirrorAlert ? `
            <div class="callout">
              <div>
                <strong style="color:var(--warning);">Double-check Makeup Mirror charger:</strong>
                <span>Your Base List has <em>Long USB-C Charger (for mirror)</em>, while Makeup Mirror is listed as <em>Android USB</em>. Update the dropdown below once you check!</span>
              </div>
              <button id="btnDismissMirrorNote" type="button" class="link-btn" style="flex-shrink:0;">Got it</button>
            </div>
          ` : ''}

          <section class="grid-4">
            ${chargerEntries.map(([chargerType, bucket]) => {
              const isUnknown = chargerType === '???';
              const matchedCables = findMatchingChargersForType(chargerType, allItems);
              const anyPacked = matchedCables.some(c => c.status === 'Yes');
              const activeCount = bucket.active.length;
              return `
                <div class="card card-padded" style="display:flex;flex-direction:column;gap:8px;${activeCount === 0 ? 'opacity:0.6;' : ''}">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <span class="status-pill ${isUnknown ? 'st-dayof' : 'st-maybe'}" style="cursor:default;">${isUnknown ? 'Needs Check (???)' : escapeHtml(chargerType)}</span>
                    <span class="text-xs muted tabular">${activeCount} needed</span>
                  </div>
                  <p class="text-xs" style="margin:0;line-height:1.5;">
                    ${activeCount > 0 ? bucket.active.map(d => escapeHtml(d.name)).join(', ') : '<span class="muted">None needed on this trip</span>'}
                    ${bucket.skipped.length > 0 ? `<span class="muted"> (skipping: ${bucket.skipped.map(d => escapeHtml(d.name)).join(', ')})</span>` : ''}
                  </p>
                  <div class="text-xs" style="padding-top:8px;border-top:1px solid var(--card-border);">
                    ${activeCount === 0
                      ? '<span class="muted">Cable optional for this trip</span>'
                      : isUnknown
                        ? '<span style="color:var(--warning);">Check cable type below</span>'
                        : matchedCables.length > 0
                          ? `<span style="color:${anyPacked ? 'var(--success)' : 'var(--error)'};">${anyPacked ? '✓ Cable packed for this trip' : 'Cable not packed yet'}</span>`
                          : '<span class="muted">Verify cable in Base List</span>'}
                  </div>
                </div>
              `;
            }).join('')}
          </section>

          <section class="card">
            <div class="cat-header">
              <div>
                <h2 style="margin:0;font-size:14px;font-weight:600;">Electronics &amp; Charger Reference</h2>
                <p class="text-xs muted" style="margin:2px 0 0;">Synced directly with <strong>Base List → Electronic</strong> · statuses reflect <strong>${escapeHtml(trip.name)}</strong>.</p>
              </div>
              <span class="text-xs muted tabular">${devices.length} devices</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Device</th>
                    <th>Charger Type</th>
                    <th>Status (${escapeHtml(trip.name)})</th>
                    <th style="text-align:right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${devices.map(row => {
                    const meta = getStatusMeta(row.status);
                    const isUnknown = row.charger === '???';
                    const isSkipped = row.status === "Don't Need";
                    const opts = CHARGER_OPTIONS.filter(Boolean);
                    const options = opts.includes(row.charger) ? opts : [row.charger, ...opts];
                    return `
                      <tr class="${isSkipped ? 'dimmed' : ''}">
                        <td style="font-weight:500;">${escapeHtml(row.name)}</td>
                        <td>
                          <select data-elec-charger="${row.id}" class="select-input ${isUnknown ? 'st-dayof' : ''}">
                            ${options.map(opt => `<option value="${escapeHtml(opt)}" ${row.charger === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}
                          </select>
                        </td>
                        <td>
                          <button type="button" data-elec-toggle-item="${row.id}" title="Click to toggle packed status" class="status-pill ${meta.cls}">
                            <span class="dot-sm" style="background-color:${meta.dot};"></span><span>${escapeHtml(meta.short)}</span>
                          </button>
                        </td>
                        <td style="text-align:right;">
                          <button type="button" data-elec-untrack="${row.id}" class="pack-all-btn" title="Remove charger tag (keeps item in Base List)">Remove</button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <form id="addElecForm" class="elec-add-form">
              <input id="newElecDevice" type="text" class="text-input" style="flex:1;" placeholder="Add device to Base List → Electronic (e.g., Kindle, Curling Iron)..." />
              <select id="newElecCharger" class="select-input">
                ${CHARGER_OPTIONS.filter(Boolean).map(opt => `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`).join('')}
              </select>
              <button type="submit" class="btn btn-primary">Add Device</button>
            </form>
          </section>
        </div>
      `;

      bindElectronicsEvents();
    }

    function bindElectronicsEvents() {
      const trip = getActiveTrip();
      const dismissBtn = document.getElementById('btnDismissMirrorNote');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => { store.dismissedMirrorNote = true; saveStore(); render(); });

          <h3>Reset "${escapeHtml(trip.name)}"</h3>
          <button type="button" id="closeModalBtn" class="muted" style="cursor:pointer;font-size:20px;line-height:1;">&times;</button>
        </div>
        <p class="text-xs muted" style="margin:0;">Reset packing statuses on this trip without affecting your other trips or Base List template.</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label class="check-card">
            <input id="optKeepDayOf" type="checkbox" checked style="margin-top:2px;accent-color:var(--primary);" />
            <span><strong style="display:block;">Keep "Packing Day Of" items</strong><span class="muted">Keep Water Bottle, Laptop, Sweatpants, etc. tagged as Day Of</span></span>
          </label>
          <label class="check-card">
            <input id="optKeepDontNeed" type="checkbox" checked style="margin-top:2px;accent-color:var(--primary);" />
            <span><strong style="display:block;">Keep "Don't Need" selections</strong><span class="muted">Uncheck to reconsider every skipped item</span></span>
          </label>
          <label class="check-card">
            <input id="optClearTripSpecific" type="checkbox" style="margin-top:2px;accent-color:var(--primary);" />
            <span><strong style="display:block;">Clear Trip Specific items &amp; Outfits</strong><span class="muted">Wipes trip-specific items and outfit pieces for this trip only</span></span>
          </label>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;">
          <button type="button" id="btnRestoreDefaults" class="text-xs muted" style="text-decoration:underline;cursor:pointer;">Restore cleaned defaults</button>
          <div style="display:flex;gap:8px;">
            <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
            <button type="button" id="confirmResetBtn" class="btn btn-primary">Reset Trip</button>
          </div>
        </div>
      `);

      document.getElementById('closeModalBtn').onclick = closeModal;
      document.getElementById('cancelModalBtn').onclick = closeModal;
      document.getElementById('btnRestoreDefaults').onclick = () => {
        const prev = clone(store);
        store = buildInitialStore();
        saveStore(); closeModal(); render();
        showToast('Restored cleaned default data', () => { store = prev; saveStore(); render(); });
      };
      document.getElementById('confirmResetBtn').onclick = () => {
        const keepDayOf = document.getElementById('optKeepDayOf').checked;
        const keepDontNeed = document.getElementById('optKeepDontNeed').checked;
        const clearTrip = document.getElementById('optClearTripSpecific').checked;
        const prev = clone(store);

        const resetStatus = (s) => {
          if (s === 'Yes') return 'Not Yet';
          if (s === 'Packing Day Of' && !keepDayOf) return 'Not Yet';
          if (s === "Don't Need" && !keepDontNeed) return 'Not Yet';
          return s;
        };

        if (clearTrip) {
          trip.tripItems = [];
          trip.outfits = trip.outfits.map(c => c.type === 'section' ? { ...c, items: [] } : { ...c, daytime: [], nighttime: [] });
        } else {
          getAllOutfitPieces(trip).forEach(e => { e.piece.status = resetStatus(e.piece.status); });
        }

        store.baseTemplate.forEach(b => {
          const cur = Object.prototype.hasOwnProperty.call(trip.baseStatuses, b.id) ? trip.baseStatuses[b.id] : 'Not Yet';
          trip.baseStatuses[b.id] = resetStatus(cur);
        });
        trip.tripItems.forEach(t => { t.status = resetStatus(t.status); });

        saveStore(); closeModal(); render();
        showToast(`Reset "${trip.name}"`, () => { store = prev; saveStore(); render(); });
      };
    }

    function openExportModal() {
      const trip = getActiveTrip();
      const allItems = getTripChecklistItems(trip);
      const customOutfits = getUniqueOutfitEntries(trip).filter(u => !u.linked);

      openModal(`
        <div class="modal-head">
          <h3>Backup &amp; Export</h3>
          <button type="button" id="closeModalBtn" class="muted" style="cursor:pointer;font-size:20px;line-height:1;">&times;</button>
        </div>
        <p class="text-xs muted" style="margin:0;">Export the active trip (including Outfits) to CSV for Google Sheets, or save/restore a full multi-trip backup.</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button type="button" id="dlCsvBtn" class="export-card">
            <div>
              <div class="text-xs" style="font-weight:600;">Export "${escapeHtml(trip.name)}" CSV</div>
              <div class="text-xs muted">Base List, Trip Specific &amp; Custom Outfits (${allItems.length + customOutfits.length} rows)</div>
            </div>
            <span class="link-btn">.csv</span>
          </button>
          <button type="button" id="dlJsonBtn" class="export-card">
            <div>
              <div class="text-xs" style="font-weight:600;">Download Full Multi-Trip Backup</div>
              <div class="text-xs muted">All ${store.trips.length} trip${store.trips.length > 1 ? 's' : ''} &amp; Base List template</div>
            </div>
            <span class="link-btn">.json</span>
          </button>
          <button type="button" id="ulJsonBtn" class="export-card">
            <div>
              <div class="text-xs" style="font-weight:600;">Import Backup JSON</div>
              <div class="text-xs muted">Load a previously saved multi-trip backup file</div>
            </div>
            <span class="link-btn">Import</span>
          </button>
        </div>
        <div style="display:flex;justify-content:flex-end;padding-top:4px;">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Close</button>
        </div>
      `);

      document.getElementById('closeModalBtn').onclick = closeModal;
      document.getElementById('cancelModalBtn').onclick = closeModal;

      document.getElementById('dlCsvBtn').onclick = () => {
        const csvEscape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const rows = [['Trip', 'List', 'Category', 'Item', 'Charger', 'Packed']];
        allItems.forEach(i => rows.push([trip.name, i.list === 'base' ? 'Base List' : 'Trip Specific', i.category, i.name, i.charger || '', i.status]));
        customOutfits.forEach(o => rows.push([trip.name, 'Outfits', 'Custom Outfit Piece', o.name, '', o.status]));
        const safeName = trip.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'packing-list';
        triggerDownload(`${safeName}.csv`, rows.map(r => r.map(csvEscape).join(',')).join('\n'), 'text/csv;charset=utf-8;');
        closeModal(); showToast(`Downloaded ${safeName}.csv`);
      };

      document.getElementById('dlJsonBtn').onclick = () => {
        triggerDownload('packing-tracker-backup.json', JSON.stringify(store, null, 2), 'application/json');
        closeModal(); showToast('Downloaded packing-tracker-backup.json');
      };

      document.getElementById('ulJsonBtn').onclick = () => { document.getElementById('importJsonInput').click(); };
    }

    function triggerDownload(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    document.getElementById('importJsonInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.trips) || !Array.isArray(parsed.baseTemplate)) {
            showToast('Invalid backup file format'); return;
          }
          const prev = clone(store);
          store = parsed;
          saveStore(); closeModal(); render();
          showToast(`Imported ${store.trips.length} trip${store.trips.length > 1 ? 's' : ''}`, () => { store = prev; saveStore(); render(); });
        } catch (err) {
          showToast('Could not parse JSON file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // Global Events
    document.querySelectorAll('.main-tab').forEach(btn => {
      btn.addEventListener('click', () => { ui.activeTab = btn.dataset.tab; render(); });
    });
    document.getElementById('btnEditTrip').addEventListener('click', openEditTripModal);
    document.getElementById('btnAddItemGlobal').addEventListener('click', openAddItemModal);
    document.getElementById('btnResetTrip').addEventListener('click', openResetTripModal);
    document.getElementById('btnExport').addEventListener('click', openExportModal);

    document.addEventListener('click', () => closePopover());
    document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePopover(); closeModal(); } });

    render();
  </script>
</body>
</html>
