<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packing List — Multi-Trip Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; padding: 0; }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font-family: inherit; color: inherit; }
    button { background: none; border: none; padding: 0; }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    @media (min-width: 640px) {
      .container { padding: 24px 24px 56px; }
    }

    /* Trips Switcher Strip */
    .trips-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .trip-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      cursor: pointer;
      flex-shrink: 0;
      text-align: left;
      transition: border-color 140ms ease, background-color 140ms ease;
      min-width: 158px;
    }
    .trip-pill:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
    .trip-pill.active {
      border-color: var(--primary);
      background-color: color-mix(in srgb, var(--primary) 9%, var(--card));
    }
    .trip-pill-info { min-width: 0; flex: 1; }
    .trip-pill-name {
      font-size: 13px; font-weight: 600; color: var(--foreground);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
    }
    .trip-pill-sub {
      font-size: 12px; color: var(--muted-foreground);
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .trip-pill-ring {
      font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
      padding: 2px 7px; border-radius: 999px;
      background-color: color-mix(in srgb, var(--success) 14%, transparent);
      color: var(--success);
      flex-shrink: 0;
    }
    .trip-add-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 600;
      border: 1px dashed var(--border); color: var(--primary);
      background-color: transparent; cursor: pointer; flex-shrink: 0;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .trip-add-pill:hover {
      border-color: var(--primary);
      background-color: color-mix(in srgb, var(--primary) 8%, transparent);
    }

    /* Header */
    .app-header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 720px) {
      .app-header { flex-direction: row; align-items: center; justify-content: space-between; }
    }
    .brand-row { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid var(--border);
      background-color: color-mix(in srgb, var(--primary) 12%, var(--card));
      color: var(--primary);
    }
    .title-wrap { min-width: 0; }
    .title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .trip-title { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; color: var(--foreground); }
    .trip-subtitle {
      font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--border); background-color: var(--card); color: var(--muted-foreground);
    }
    .trip-edit-link {
      font-size: 12px; color: var(--muted-foreground); cursor: pointer;
      padding: 2px 6px; border-radius: 6px; transition: color 140ms ease, background-color 140ms ease;
    }
    .trip-edit-link:hover {
      color: var(--primary);
      background-color: color-mix(in srgb, var(--primary) 8%, transparent);
    }
    .header-meta {
      margin: 3px 0 0; font-size: 12px; color: var(--muted-foreground);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 9px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: opacity 140ms ease, background-color 140ms ease, border-color 140ms ease;
      white-space: nowrap;
    }
    .btn-primary { background-color: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background-color: var(--card); color: var(--foreground); border: 1px solid var(--border); }
    .btn-secondary:hover { background-color: color-mix(in srgb, var(--foreground) 5%, var(--card)); }
    .btn-danger {
      background-color: color-mix(in srgb, var(--error) 12%, transparent);
      color: var(--error);
      border: 1px solid color-mix(in srgb, var(--error) 28%, transparent);
    }
    .btn-danger:hover { background-color: color-mix(in srgb, var(--error) 18%, transparent); }

    /* Main Tabs */
    .nav-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tab-group {
      display: inline-flex; padding: 4px; border-radius: 12px;
      background-color: var(--card); border: 1px solid var(--border); gap: 4px; flex-wrap: wrap;
    }
    .main-tab {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background-color 140ms ease, color 140ms ease;
      color: var(--muted-foreground);
    }
    .main-tab:hover { color: var(--foreground); }
    .main-tab.active { background-color: var(--primary); color: var(--primary-foreground); }
    .tab-badge { padding: 1px 6px; border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .quick-stats {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums;
    }
    .stat-item { display: inline-flex; align-items: center; gap: 6px; }
    .stat-item strong { color: var(--foreground); font-weight: 600; }
    .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .dot-sm { width: 6px; height: 6px; border-radius: 999px; display: inline-block; flex-shrink: 0; }

    /* Cards & Grids */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .card { border-radius: 16px; border: 1px solid var(--border); background-color: var(--card); overflow: hidden; }
    .card-padded { padding: 18px 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 960px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 720px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1080px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .grid-4 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    /* Alert Banner */
    .callout {
      border-radius: 14px;
      padding: 12px 16px;
      border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--border));
      background-color: color-mix(in srgb, var(--warning) 10%, var(--card));
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      font-size: 12px;
    }

    /* Readiness Section */
    .readiness-top { display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 640px) {
      .readiness-top { flex-direction: row; align-items: flex-end; justify-content: space-between; }
    }
    .readiness-label { font-size: 12px; color: var(--muted-foreground); font-weight: 500; }
    .readiness-metric { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; flex-wrap: wrap; }
    .readiness-pct { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .readiness-detail { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .readiness-detail strong { color: var(--foreground); font-weight: 600; }

    .scope-switcher {
      display: inline-flex; padding: 4px; border-radius: 12px;
      border: 1px solid var(--border); background-color: var(--background); gap: 4px;
      align-self: flex-start;
    }
    .scope-btn {
      padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted-foreground); border: 1px solid transparent; transition: all 140ms ease;
    }
    .scope-btn:hover { color: var(--foreground); }
    .scope-btn.active { background-color: var(--card); color: var(--foreground); border-color: var(--border); }

    .progress-track {
      width: 100%; height: 10px; border-radius: 999px; overflow: hidden; display: flex;
      background-color: color-mix(in srgb, var(--foreground) 8%, transparent);
    }
    .progress-thin { width: 100%; height: 4px; background-color: color-mix(in srgb, var(--foreground) 6%, transparent); }
    .progress-seg { height: 100%; transition: width 260ms ease; }

    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .chip-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border); background-color: var(--card); color: var(--foreground);
      cursor: pointer; transition: all 140ms ease; white-space: nowrap;
    }
    .chip:hover { background-color: color-mix(in srgb, var(--foreground) 5%, var(--card)); }
    .chip.active { background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .chip-square { border-radius: 8px; }

    .toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 8px; font-size: 12px;
      border: 1px solid var(--border); color: var(--muted-foreground);
      cursor: pointer; transition: all 140ms ease;
    }
    .toggle-btn:hover { color: var(--foreground); }
    .toggle-btn.on {
      border-color: var(--primary); color: var(--primary);
      background-color: color-mix(in srgb, var(--primary) 10%, transparent);
    }

    /* Search & Category Bar */
    .toolbar-row { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 768px) {
      .toolbar-row { flex-direction: row; align-items: center; justify-content: space-between; }
    }
    .search-box { position: relative; width: 100%; max-width: 300px; flex-shrink: 0; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); pointer-events: none; }
    .search-input {
      width: 100%; padding: 7px 30px 7px 34px; border-radius: 12px; font-size: 12px;
      background-color: var(--card); border: 1px solid var(--border);
      color: var(--foreground); outline: none;
    }
    .search-input::placeholder { color: var(--placeholder); }
    .search-input:focus { border-color: var(--primary); }
    .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); cursor: pointer; font-size: 16px; line-height: 1; }
    .cat-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

    /* Category Card */
    .cat-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .collapse-btn { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; cursor: pointer; }
    .collapse-btn h2 {
      margin: 0; font-size: 14px; font-weight: 600; color: var(--foreground);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chevron { color: var(--muted-foreground); transition: transform 160ms ease; flex-shrink: 0; }
    .chevron.collapsed { transform: rotate(-90deg); }
    .list-tag {
      font-size: 12px; padding: 1px 8px; border-radius: 6px; flex-shrink: 0;
      border: 1px solid var(--border); color: var(--muted-foreground);
    }
    .charger-tag {
      font-size: 12px; padding: 1px 6px; border-radius: 6px; flex-shrink: 0;
      border: 1px solid var(--border); color: var(--muted-foreground);
      background-color: var(--background);
    }
    .charger-tag.warn {
      color: var(--warning);
      border-color: color-mix(in srgb, var(--warning) 35%, transparent);
      background-color: color-mix(in srgb, var(--warning) 12%, transparent);
    }
    .cat-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .pack-all-btn { font-size: 12px; color: var(--muted-foreground); cursor: pointer; transition: color 140ms ease; }
    .pack-all-btn:hover { color: var(--primary); }
    .cat-count { font-size: 12px; font-weight: 500; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

    /* Item Rows */
    .item-list { list-style: none; margin: 0; padding: 0; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--card-border); transition: background-color 120ms ease;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background-color: color-mix(in srgb, var(--foreground) 4%, transparent); }
    .item-row.skipped { opacity: 0.56; }
    .item-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .check-circle {
      width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      cursor: pointer; transition: all 140ms ease;
    }
    .check-circle:active { transform: scale(0.9); }
    .check-circle.checked { background-color: var(--success); border-color: var(--success); color: var(--background); }
    .item-name {
      font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: text; user-select: none; color: var(--foreground); font-weight: 500;
    }
    .item-name.packed { color: var(--muted-foreground); font-weight: 400; }
    .item-name.skipped { color: var(--muted-foreground); text-decoration: line-through; font-weight: 400; }
    .inline-edit {
      width: 100%; font-size: 13px; background-color: var(--background);
      color: var(--foreground); border: 1px solid var(--primary);
      border-radius: 6px; padding: 2px 6px; outline: none;
    }
    .item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* Status Pills */
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
      border: 1px solid transparent; cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
      white-space: nowrap;
    }
    .status-pill:active { transform: scale(0.97); }
    .st-yes {
      background-color: color-mix(in srgb, var(--success) 15%, transparent);
      color: var(--success); border-color: color-mix(in srgb, var(--success) 32%, transparent);
    }
    .st-notyet {
      background-color: color-mix(in srgb, var(--error) 14%, transparent);
      color: var(--error); border-color: color-mix(in srgb, var(--error) 30%, transparent);
    }
    .st-dayof {
      background-color: color-mix(in srgb, var(--warning) 16%, transparent);
      color: var(--warning); border-color: color-mix(in srgb, var(--warning) 34%, transparent);
    }
    .st-maybe {
      background-color: color-mix(in srgb, var(--chart-1) 15%, transparent);
      color: var(--chart-1); border-color: color-mix(in srgb, var(--chart-1) 32%, transparent);
    }
    .st-dontneed {
      background-color: color-mix(in srgb, var(--muted-foreground) 12%, transparent);
      color: var(--muted-foreground); border-color: color-mix(in srgb, var(--border) 80%, transparent);
    }

    .icon-del {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground); opacity: 0; cursor: pointer;
      transition: opacity 120ms ease, color 120ms ease;
    }
    .item-row:hover .icon-del, .outfit-piece:hover .icon-del, .icon-del:focus { opacity: 1; }
    .icon-del:hover { color: var(--error); }

    /* Quick Add */
    .quick-add-form { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--card-border); }
    .quick-add-input { flex: 1; background: transparent; border: none; outline: none; font-size: 12px; color: var(--foreground); padding: 2px 0; }
    .quick-add-input::placeholder { color: var(--placeholder); }
    .link-btn { font-size: 12px; font-weight: 600; color: var(--primary); cursor: pointer; padding: 2px 4px; }
    .link-btn:hover { text-decoration: underline; }

    /* Outfits */
    .slot-block { padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--card-border); }
    .slot-block:first-child { border-top: none; }
    .slot-head { display: flex; align-items: center; justify-content: space-between; }
    .slot-label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted-foreground);
    }
    .outfit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .outfit-piece {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; border-radius: 10px;
      border: 1px solid var(--card-border); background-color: var(--background);
    }
    .outfit-piece.skipped { opacity: 0.56; }
    .sync-tag {
      font-size: 12px; color: var(--muted-foreground);
      padding: 0 5px; border-radius: 5px;
      background-color: color-mix(in srgb, var(--foreground) 6%, transparent);
      flex-shrink: 0;
    }
    .outfit-add-form { display: flex; align-items: center; gap: 6px; padding-top: 4px; }
    .outfit-add-input {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid transparent;
      font-size: 12px; color: var(--foreground); padding: 4px 0; outline: none;
    }
    .outfit-add-input:focus { border-bottom-color: var(--primary); }
    .outfit-add-input::placeholder { color: var(--placeholder); }
    .day-title:focus { box-shadow: 0 0 0 2px var(--primary); }

    /* Electronics Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
    td { padding: 10px 16px; border-bottom: 1px solid var(--card-border); font-size: 13px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background-color: color-mix(in srgb, var(--foreground) 4%, transparent); }
    tr.dimmed { opacity: 0.52; }
    .select-input, .text-input {
      padding: 6px 10px; border-radius: 10px; font-size: 12px;
      background-color: var(--background); border: 1px solid var(--border);
      color: var(--foreground); outline: none;
    }
    .select-input:focus, .text-input:focus { border-color: var(--primary); }
    .elec-add-form { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 640px) { .elec-add-form { flex-direction: row; align-items: center; } }

    /* Popover, Modal, Toast */
    .hidden { display: none !important; }
    .popover-menu {
      position: fixed; z-index: 50; width: 176px;
      border-radius: 12px; border: 1px solid var(--border);
      background-color: var(--card); padding: 6px;
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.24), 0 2px 8px -2px rgba(0, 0, 0, 0.12);
      animation: fadeIn 120ms ease-out;
    }
    .pop-opt {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 12px;
      text-align: left; cursor: pointer; color: var(--foreground);
    }
    .pop-opt:hover { background-color: color-mix(in srgb, var(--foreground) 6%, transparent); }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background-color: rgba(0, 0, 0, 0.48); backdrop-filter: blur(2px);
    }
    .modal-box {
      width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
      border-radius: 16px; border: 1px solid var(--border); background-color: var(--card);
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.28);
      animation: fadeIn 140ms ease-out;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin-bottom: 5px; }
    .check-card {
      display: flex; align-items: flex-start; gap: 10px; padding: 12px;
      border-radius: 12px; border: 1px solid var(--border); background-color: var(--background);
      cursor: pointer; font-size: 12px;
    }
    .export-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background-color: var(--background); cursor: pointer; text-align: left; width: 100%;
      transition: border-color 140ms ease;
    }

    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 70;

      padding: 10px 16px; border-radius: 12px;

      box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.22);
      animation: fadeIn 140ms ease-out;
    }

      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-state { padding: 40px 20px; text-align: center; }
    .muted { color: var(--muted-foreground); }

      let trip = store.trips.find(t => t.id === store.activeTripId);
      if (!trip) { trip = store.trips[0]; store.activeTripId = trip.id; }
      return trip;
    }

    function normalizeText(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    }

    function getTripChecklistItems(trip = getActiveTrip()) {
      const base = store.baseTemplate.map(b => ({
        id: b.id,
        list: 'base',
        category: b.category,
        name: b.name,
        charger: b.charger || '',
        status: Object.prototype.hasOwnProperty.call(trip.baseStatuses, b.id) ? trip.baseStatuses[b.id] : 'Not Yet'
      }));
      const specific = trip.tripItems.map(t => ({
        id: t.id,
        list: 'trip',
        category: t.category,
        name: t.name,
        charger: '',
        status: t.status
      }));
      return [...base, ...specific];
    }

    // Iterate every outfit piece across days & custom sections
    function getAllOutfitPieces(trip = getActiveTrip()) {
      const list = [];
      (trip.outfits || []).forEach(card => {
        if (card.type === 'section') {
          (card.items || []).forEach(p => list.push({ card, slot: 'items', piece: p }));
        } else {
          (card.daytime || []).forEach(p => list.push({ card, slot: 'daytime', piece: p }));
          (card.nighttime || []).forEach(p => list.push({ card, slot: 'nighttime', piece: p }));
        }
      });
      return list;
    }

    // Check if an outfit piece matches an item in Base List or Trip Specific (e.g. Dunks, Pajamas, Thick Black Belt)
    function findLinkedChecklistItem(pieceName, checklistItems) {
      const norm = normalizeText(pieceName);
      if (!norm) return null;
      return checklistItems.find(i => normalizeText(i.name) === norm) || null;
    }

    // Get effective status of an outfit piece (synced if linked to checklist)
    function getOutfitPieceStatus(piece, checklistItems) {
      const linked = findLinkedChecklistItem(piece.name, checklistItems);
      return linked ? linked.status : (piece.status || 'Not Yet');
    }

    // Update status of an outfit piece — syncs across repeated days AND any linked checklist item!
    function setOutfitPieceStatus(pieceId, newStatus, trip = getActiveTrip()) {
      const entries = getAllOutfitPieces(trip);
      const target = entries.find(e => e.piece.id === pieceId);
      if (!target) return;
      const targetNorm = normalizeText(target.piece.name);

      // Update all outfit pieces with same normalized name (e.g. Alo Sweat Suit on Thu & Mon)
      entries.forEach(e => {
        if (normalizeText(e.piece.name) === targetNorm) {
          e.piece.status = newStatus;
        }
      });

      // Also sync if linked to Base List or Trip Specific
      const checklistItems = getTripChecklistItems(trip);
      const linked = findLinkedChecklistItem(target.piece.name, checklistItems);
      if (linked) {
        setItemStatus(linked.id, newStatus, trip);
      }
    }

    // Unique outfit pieces for Outfits readiness stats (deduplicates repeated pieces like Alo Sweat Suit)
    function getUniqueOutfitEntries(trip = getActiveTrip()) {
      const checklistItems = getTripChecklistItems(trip);
      const seen = new Set();
      const unique = [];
      getAllOutfitPieces(trip).forEach(e => {
        const key = normalizeText(e.piece.name);
        if (!key || seen.has(key)) return;
        seen.add(key);
        const linked = findLinkedChecklistItem(e.piece.name, checklistItems);
        unique.push({
          name: e.piece.name,
          status: linked ? linked.status : (e.piece.status || 'Not Yet'),
          linked
        });
      });
      return unique;
    }

    // Full trip stats combining Checklist + unique non-linked Outfits clothing pieces
    function computeFullTripStats(trip = getActiveTrip()) {
      const checklistItems = getTripChecklistItems(trip);
      const customOutfitOnly = getUniqueOutfitEntries(trip)
        .filter(u => !u.linked)
        .map(u => ({ status: u.status }));
      return computeStats([...checklistItems, ...customOutfitOnly]);
    }

    function getTrackedDevices(trip = getActiveTrip()) {
      return getTripChecklistItems(trip).filter(i => i.list === 'base' && i.category === 'Electronic' && i.charger);
    }

    function setItemStatus(itemId, newStatus, trip = getActiveTrip()) {
      let itemName = '';
      const baseItem = store.baseTemplate.find(b => b.id === itemId);
      if (baseItem) {
        trip.baseStatuses[itemId] = newStatus;
        itemName = baseItem.name;
      } else {
        const t = trip.tripItems.find(x => x.id === itemId);
        if (t) { t.status = newStatus; itemName = t.name; }
      }
      // Mirror status into any matching outfit pieces
      if (itemName) {
        const norm = normalizeText(itemName);
        getAllOutfitPieces(trip).forEach(e => {
          if (normalizeText(e.piece.name) === norm) e.piece.status = newStatus;
        });
      }
    }

    function setItemCharger(itemId, charger) {
      const b = store.baseTemplate.find(x => x.id === itemId);
      if (b) b.charger = charger;
    }

    function renameItem(itemId, newName, trip = getActiveTrip()) {
      const b = store.baseTemplate.find(x => x.id === itemId);
      if (b) { b.name = newName; return; }
      const t = trip.tripItems.find(x => x.id === itemId);
      if (t) t.name = newName;
    }

    function deleteItem(itemId, trip = getActiveTrip()) {
      const bIdx = store.baseTemplate.findIndex(x => x.id === itemId);
      if (bIdx !== -1) {
        store.baseTemplate.splice(bIdx, 1);
        store.trips.forEach(tr => { delete tr.baseStatuses[itemId]; });
        return;
      }
      trip.tripItems = trip.tripItems.filter(x => x.id !== itemId);
    }

    function addItemToList(list, category, name, status = 'Not Yet', charger = '', trip = getActiveTrip()) {
      const id = `${list}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      if (list === 'base') {
        store.baseTemplate.push({ id, category, name, charger: charger || '' });
        store.trips.forEach(tr => { tr.baseStatuses[id] = tr.id === trip.id ? status : 'Not Yet'; });
      } else {
        trip.tripItems.push({ id, category, name, status });
      }
      return id;
    }

    function saveStore(withIndicator = true) {
      try { localStorage.setItem(STORAGE_KEY_V4, JSON.stringify(store)); } catch (e) {}
      if (withIndicator) {
        const el = document.getElementById('saveIndicator');
        if (el) {
          el.textContent = 'Saved just now';
          clearTimeout(saveStore._t);
          saveStore._t = setTimeout(() => { el.textContent = 'Saved locally'; }, 1800);
        }
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getStatusMeta(val) {
      return STATUSES.find(s => s.value === val) || STATUSES[1];
    }

    function showToast(message, undoFn = null) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMsg');
      const undoBtn = document.getElementById('toastUndo');
      msgEl.textContent = message;
      if (undoFn) {
        undoBtn.classList.remove('hidden');
        undoBtn.onclick = () => { undoFn(); toast.classList.add('hidden'); };
      } else {
        undoBtn.classList.add('hidden');
        undoBtn.onclick = null;
      }
      toast.classList.remove('hidden');
      clearTimeout(ui.toastTimer);
      ui.toastTimer = setTimeout(() => toast.classList.add('hidden'), 4500);
    }

    function parseIsoLocal(iso) {
      if (!iso) return null;
      const parts = iso.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatDateRange(startIso, endIso) {
      const s = parseIsoLocal(startIso);
      const e = parseIsoLocal(endIso);
      if (!s && !e) return 'Dates TBD';
      const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      if (s && !e) return fmt(s);
      if (!s && e) return fmt(e);
      if (s.getTime() === e.getTime()) return fmt(s);
      if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
        return `${s.toLocaleDateString('en-US', { month: 'short' })} ${s.getDate()} – ${e.getDate()}`;
      }
      return `${fmt(s)} – ${fmt(e)}`;
    }

    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function generateOutfitDaysFromDates(startIso, endIso) {
      const s = parseIsoLocal(startIso);
      const e = parseIsoLocal(endIso);
      const days = [];
      if (!s) {
        days.push({ id: `day-${Date.now()}-1`, type: 'day', label: 'Day 1', daytime: [], nighttime: [] });
      } else {
        const end = e && e >= s ? e : s;
        const cur = new Date(s.getTime());
        let safety = 0;
        while (cur <= end && safety < 21) {
          const weekday = cur.toLocaleDateString('en-US', { weekday: 'long' });
          const month = cur.toLocaleDateString('en-US', { month: 'long' });
          days.push({
            id: `day-${Date.now()}-${safety}`,
            type: 'day',
            label: `${weekday}, ${month} ${ordinal(cur.getDate())}`,
            daytime: [],
            nighttime: []
          });
          cur.setDate(cur.getDate() + 1);
          safety++;
        }
      }
      days.push({ id: `sec-${Date.now()}-extra`, type: 'section', label: 'Extra & Backup Pieces', items: [] });
      return days;
    }

    function findMatchingChargersForType(chargerType, items) {
      const norm = normalizeText(chargerType);
      const electronicsItems = items.filter(i => i.list === 'base' && i.category === 'Electronic');
      if (norm === 'usb c' || norm === 'usbc') return electronicsItems.filter(i => /usb[\s-]*c|laptop charger/i.test(i.name));
      if (norm === 'android usb') return electronicsItems.filter(i => /android/i.test(i.name));
      if (norm === 'usb') return electronicsItems.filter(i => /watch charger|charging block|phone charger/i.test(i.name));
      if (norm === 'lightning') return electronicsItems.filter(i => /phone charger|lightning/i.test(i.name));
      return [];
    }

    function computeStats(items) {
      const counts = { total: items.length, yes: 0, notYet: 0, dayOf: 0, maybe: 0, dontNeed: 0 };
      for (const item of items) {
        if (item.status === 'Yes') counts.yes++;
        else if (item.status === 'Packing Day Of') counts.dayOf++;
        else if (item.status === 'Maybe') counts.maybe++;
        else if (item.status === "Don't Need") counts.dontNeed++;
        else counts.notYet++;
      }
      counts.required = counts.yes + counts.notYet + counts.dayOf;
      counts.remaining = counts.notYet + counts.dayOf;
      counts.pct = counts.required > 0 ? Math.round((counts.yes / counts.required) * 100) : 100;
      return counts;
    }

    // Render Trips Bar + Chrome
    function renderTripsBar() {
      const bar = document.getElementById('tripsBar');
      const activeId = getActiveTrip().id;

      bar.innerHTML = store.trips.map(tr => {
        const st = computeFullTripStats(tr);
        const active = tr.id === activeId;
        const dateStr = formatDateRange(tr.startDate, tr.endDate);
        return `
          <button type="button" data-select-trip="${tr.id}" class="trip-pill ${active ? 'active' : ''}">
            <div class="trip-pill-info">
              <div class="trip-pill-name">${escapeHtml(tr.name)}</div>
              <div class="trip-pill-sub">${escapeHtml(tr.destination ? `${tr.destination} · ${dateStr}` : dateStr)}</div>
            </div>
            <span class="trip-pill-ring" style="${st.pct < 100 && st.remaining > 0 ? 'background-color:color-mix(in srgb, var(--primary) 13%, transparent);color:var(--primary);' : ''}">${st.pct}%</span>
          </button>
        `;
      }).join('') + `
        <button id="btnCreateTrip" type="button" class="trip-add-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Trip</span>
        </button>
      `;

      bar.querySelectorAll('[data-select-trip]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (store.activeTripId === btn.dataset.selectTrip) return;
          store.activeTripId = btn.dataset.selectTrip;
          ui.categoryFilter = 'all';
          ui.statusFilter = 'all';
          ui.outfitStatusFilter = 'all';
          ui.search = '';
          saveStore(false);
          render();
        });
      });

      const addTripBtn = document.getElementById('btnCreateTrip');
      if (addTripBtn) addTripBtn.addEventListener('click', openCreateTripModal);
    }

    function renderChrome() {
      renderTripsBar();
      const trip = getActiveTrip();
      const checklistStats = computeStats(getTripChecklistItems(trip));
      const outfitStats = computeStats(getUniqueOutfitEntries(trip));
      const fullStats = computeFullTripStats(trip);
      const trackedDevices = getTrackedDevices(trip);
      const unknownChargers = trackedDevices.filter(d => d.charger === '???' && d.status !== "Don't Need").length;

      document.getElementById('tripTitle').textContent = trip.name;
      const dateRange = formatDateRange(trip.startDate, trip.endDate);
      document.getElementById('tripSubtitle').textContent = trip.destination ? `${trip.destination} · ${dateRange}` : dateRange;
      document.getElementById('tripMetaLeft').textContent = `${store.trips.length} trip${store.trips.length > 1 ? 's' : ''} · ${fullStats.pct}% overall packed`;

      document.querySelectorAll('.main-tab').forEach(btn => {
        const active = btn.dataset.tab === ui.activeTab;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      const bChecklist = document.getElementById('tabBadgeChecklist');
      bChecklist.textContent = checklistStats.remaining > 0 ? `${checklistStats.remaining} left` : 'Done';
      bChecklist.style.backgroundColor = ui.activeTab === 'checklist'
        ? 'color-mix(in srgb, var(--primary-foreground) 18%, transparent)'
        : 'color-mix(in srgb, var(--foreground) 8%, transparent)';

      const bOutfits = document.getElementById('tabBadgeOutfits');
      bOutfits.textContent = outfitStats.remaining > 0 ? `${outfitStats.remaining} left` : outfitStats.total > 0 ? 'Done' : 'Custom';
      bOutfits.style.backgroundColor = ui.activeTab === 'outfits'
        ? 'color-mix(in srgb, var(--primary-foreground) 18%, transparent)'
        : 'color-mix(in srgb, var(--foreground) 8%, transparent)';

      const bElec = document.getElementById('tabBadgeElectronics');
      bElec.textContent = unknownChargers > 0 ? `${unknownChargers} ???` : `${trackedDevices.length}`;
      bElec.style.backgroundColor = ui.activeTab === 'electronics'
        ? 'color-mix(in srgb, var(--primary-foreground) 18%, transparent)'
        : (unknownChargers > 0 ? 'color-mix(in srgb, var(--warning) 20%, transparent)' : 'color-mix(in srgb, var(--foreground) 8%, transparent)');
      bElec.style.color = (ui.activeTab !== 'electronics' && unknownChargers > 0) ? 'var(--warning)' : '';

      document.getElementById('headerQuickStats').innerHTML = `
        <span class="stat-item"><span class="dot" style="background: var(--success)"></span><strong>${fullStats.yes}</strong> packed</span>
        <span class="stat-item"><span class="dot" style="background: var(--error)"></span><strong>${fullStats.notYet}</strong> to pack</span>
        <span class="stat-item"><span class="dot" style="background: var(--warning)"></span><strong>${fullStats.dayOf}</strong> day-of</span>
      `;
    }

    function render() {
      closePopover();
      renderChrome();
      const container = document.getElementById('viewContainer');
      if (ui.activeTab === 'checklist') renderChecklistView(container);
      else if (ui.activeTab === 'outfits') renderOutfitsView(container);
      else renderElectronicsView(container);
    }

    // VIEW 1: PACKING CHECKLIST
    function renderChecklistView(container) {
      const trip = getActiveTrip();
      const allItems = getTripChecklistItems(trip);
      const scoped = ui.listScope === 'base' ? allItems.filter(i => i.list === 'base')
        : ui.listScope === 'trip' ? allItems.filter(i => i.list === 'trip')
        : allItems;
      const stats = computeStats(scoped);
      const yesPct = stats.required ? (stats.yes / stats.required) * 100 : 100;
      const dayOfPct = stats.required ? (stats.dayOf / stats.required) * 100 : 0;

      const availableCategories = [];
      if (ui.listScope === 'all' || ui.listScope === 'base') {
        store.baseCategories.forEach(c => { if (!availableCategories.includes(c)) availableCategories.push(c); });
      }
      if (ui.listScope === 'all' || ui.listScope === 'trip') {
        store.tripCategories.forEach(c => { if (!availableCategories.includes(c)) availableCategories.push(c); });
      }
      scoped.forEach(i => { if (!availableCategories.includes(i.category)) availableCategories.push(i.category); });
      if (ui.categoryFilter !== 'all' && !availableCategories.includes(ui.categoryFilter)) ui.categoryFilter = 'all';

      const q = ui.search.trim().toLowerCase();
      const filtered = scoped.filter(item => {
        if (ui.hideDontNeed && item.status === "Don't Need" && ui.statusFilter !== "Don't Need") return false;
        if (ui.categoryFilter !== 'all' && item.category !== ui.categoryFilter) return false;
        if (ui.statusFilter === 'topack') {
          if (item.status !== 'Not Yet') return false;
        } else if (ui.statusFilter !== 'all') {
          if (item.status !== ui.statusFilter) return false;
        }
        if (q && !item.name.toLowerCase().includes(q) && !item.category.toLowerCase().includes(q) && !(item.charger || '').toLowerCase().includes(q)) return false;
        return true;
      });

      const groupMap = new Map();
      const orderedKeys = [];
      const seedGroup = (list, category) => {
        const key = `${list}::${category}`;
        if (!groupMap.has(key)) {
          groupMap.set(key, { key, list, category, items: [] });
          orderedKeys.push(key);
        }
      };
      if (ui.listScope === 'all' || ui.listScope === 'base') store.baseCategories.forEach(c => seedGroup('base', c));
      if (ui.listScope === 'all' || ui.listScope === 'trip') store.tripCategories.forEach(c => seedGroup('trip', c));
      filtered.forEach(item => { seedGroup(item.list, item.category); groupMap.get(`${item.list}::${item.category}`).items.push(item); });

      const isFiltering = ui.statusFilter !== 'all' || ui.categoryFilter !== 'all' || q.length > 0;
      const groups = orderedKeys.map(k => groupMap.get(k)).filter(g => {
        if (isFiltering) return g.items.length > 0;
        if (ui.listScope === 'all' && g.list === 'trip' && g.items.length === 0 && trip.tripItems.length === 0) return false;
        return true;
      });
      if (ui.sortByStatus) groups.forEach(g => g.items.sort((a, b) => getStatusMeta(a.status).order - getStatusMeta(b.status).order));

      const baseCount = store.baseTemplate.length;
      const tripCount = trip.tripItems.length;
      const statusChips = [
        { key: 'all', label: 'All', count: stats.total, dot: null },
        { key: 'topack', label: 'To Pack', count: stats.notYet, dot: 'var(--error)' },
        { key: 'Packing Day Of', label: 'Day Of', count: stats.dayOf, dot: 'var(--warning)' },
        { key: 'Maybe', label: 'Maybe', count: stats.maybe, dot: 'var(--chart-1)' },
        { key: 'Yes', label: 'Packed', count: stats.yes, dot: 'var(--success)' },
        { key: "Don't Need", label: "Don't Need", count: stats.dontNeed, dot: 'var(--muted-foreground)' }
      ];

      container.innerHTML = `
        <div class="stack">
          <section class="card card-padded" style="display:flex;flex-direction:column;gap:14px;">
            <div class="readiness-top">
              <div>
                <div class="readiness-label">
                  ${escapeHtml(trip.name)} · ${ui.listScope === 'all' ? 'Checklist Readiness' : ui.listScope === 'base' ? 'Base List' : 'Trip Specific (Toiletries, Shoes, Accessories & Other)'}
                </div>
                <div class="readiness-metric">
                  <span class="readiness-pct">${stats.pct}%</span>
                  <span class="readiness-detail">
                    <strong>${stats.yes}</strong> of <strong>${stats.required}</strong> needed items packed
                    ${stats.maybe > 0 ? `· ${stats.maybe} maybe` : ''}
                    ${stats.dontNeed > 0 ? `· ${stats.dontNeed} skipped` : ''}
                  </span>
                </div>
              </div>

              <div class="scope-switcher">
                ${[
                  { id: 'all', label: 'All', count: allItems.length },
                  { id: 'base', label: 'Base List', count: baseCount },
                  { id: 'trip', label: 'Trip Specific', count: tripCount }
                ].map(s => `
                  <button type="button" data-scope="${s.id}" class="scope-btn ${ui.listScope === s.id ? 'active' : ''}">
                    <span>${s.label}</span><span class="tabular" style="opacity:0.7;">${s.count}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="progress-track">
              <div class="progress-seg" style="width:${yesPct.toFixed(1)}%;background-color:var(--success);" title="${stats.yes} Packed"></div>
              <div class="progress-seg" style="width:${dayOfPct.toFixed(1)}%;background-color:var(--warning);" title="${stats.dayOf} Packing Day Of"></div>
            </div>

            <div class="filter-row">
              <div class="chip-wrap">
                ${statusChips.map(ch => `
                  <button type="button" data-status-filter="${escapeHtml(ch.key)}" class="chip status-filter-btn ${ui.statusFilter === ch.key ? 'active' : ''}">
                    ${ch.dot ? `<span class="dot-sm" style="background-color:${ui.statusFilter === ch.key ? 'currentColor' : ch.dot};"></span>` : ''}
                    <span>${ch.label}</span>
                    <span class="tabular" style="opacity:0.75;">${ch.count}</span>
                  </button>
                `).join('')}
              </div>

              <div class="chip-wrap">
                <button id="toggleHideDontNeed" type="button" class="toggle-btn ${ui.hideDontNeed ? 'on' : ''}">
                  <span>${ui.hideDontNeed ? "Hiding Don't Need" : "Hide Don't Need"}</span>
                </button>
                <button id="toggleSortStatus" type="button" class="toggle-btn ${ui.sortByStatus ? 'on' : ''}" title="Put unpacked items at the top of each category">
                  <span>${ui.sortByStatus ? 'Unpacked First' : 'Sheet Order'}</span>
                </button>
              </div>
            </div>
          </section>

          <section class="toolbar-row">
            <div class="search-box">
              <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="searchInput" class="search-input" type="text" value="${escapeHtml(ui.search)}" placeholder="Search items, categories, or chargers..." />
              ${ui.search ? '<button id="clearSearchBtn" type="button" class="search-clear">&times;</button>' : ''}
            </div>

            <div class="cat-scroll">
              <button type="button" data-cat="all" class="chip chip-square cat-btn ${ui.categoryFilter === 'all' ? 'active' : ''}">All Categories</button>
              ${availableCategories.map(c => `
                <button type="button" data-cat="${escapeHtml(c)}" class="chip chip-square cat-btn ${ui.categoryFilter === c ? 'active' : ''}">${escapeHtml(c)}</button>
              `).join('')}
            </div>
          </section>

          ${groups.length === 0 ? `
            <div class="card empty-state">
              <p style="margin:0 0 6px;font-weight:600;">No items match your current filters</p>
              <p class="text-xs muted" style="margin:0 0 14px;">Try clearing the search or switching status filters.</p>
              <button id="btnClearFilters" type="button" class="btn btn-primary">Clear Filters</button>
            </div>
          ` : `
            <div class="grid-2">${groups.map(g => renderCategoryCard(g, allItems)).join('')}</div>
          `}
        </div>
      `;

      bindChecklistEvents();
    }

    function renderCategoryCard(group, allItems) {
      const allGroupItems = allItems.filter(i => i.list === group.list && i.category === group.category);
      const gStats = computeStats(allGroupItems);
      const collapsed = !!ui.collapsedGroups[group.key];
      const listLabel = group.list === 'base' ? 'Base List' : 'Trip Specific';

      return `
        <article class="card">
          <div class="cat-header">
            <button type="button" data-collapse="${escapeHtml(group.key)}" class="collapse-btn">
              <svg class="chevron ${collapsed ? 'collapsed' : ''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              <h2>${escapeHtml(group.category)}</h2>
              ${ui.listScope === 'all' ? `
                <span class="list-tag" style="background-color:color-mix(in srgb, ${group.list === 'trip' ? 'var(--chart-2)' : 'var(--foreground)'} 8%, transparent);">${listLabel}</span>
              ` : ''}
            </button>

            <div class="cat-header-right">
              ${gStats.remaining > 0 ? `
                <button type="button" data-pack-all-list="${group.list}" data-pack-all-cat="${escapeHtml(group.category)}" class="pack-all-btn" title="Mark remaining items as Packed">Pack all</button>
              ` : gStats.required > 0 ? `
                <span class="text-xs" style="color:var(--success);font-weight:500;">All packed</span>
              ` : ''}
              <span class="cat-count">${gStats.yes}/${gStats.required}</span>
            </div>
          </div>

          <div class="progress-thin">
            <div class="progress-seg" style="width:${gStats.required ? gStats.pct : 0}%;background-color:var(--success);"></div>
          </div>

          ${collapsed ? '' : `
            ${group.items.length === 0 ? `
              <p class="text-xs muted" style="margin:0;padding:12px 14px;font-style:italic;">No items in ${escapeHtml(group.category)} yet — add one below.</p>
            ` : `
              <ul class="item-list">${group.items.map(renderItemRow).join('')}</ul>
            `}
            <form class="quick-add-form" data-list="${group.list}" data-category="${escapeHtml(group.category)}">
              <svg width="14" height="14" class="muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              <input type="text" class="quick-add-input" placeholder="Add to ${escapeHtml(group.category)} (${listLabel})..." />
              <button type="submit" class="link-btn">Add</button>
            </form>
          `}
        </article>
      `;
    }

    function renderItemRow(item) {
      const meta = getStatusMeta(item.status);
      const isPacked = item.status === 'Yes';
      const isSkipped = item.status === "Don't Need";

      return `
        <li class="item-row ${isSkipped ? 'skipped' : ''}">
          <div class="item-left">
            <button type="button" data-toggle-id="${item.id}" aria-label="Toggle packed status for ${escapeHtml(item.name)}"
                    class="check-circle ${isPacked ? 'checked' : ''}">
              ${isPacked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
            </button>
            <span data-edit-id="${item.id}" title="Double-click to rename"
                  class="item-name ${isSkipped ? 'skipped' : isPacked ? 'packed' : ''}">${escapeHtml(item.name)}</span>
            ${item.charger ? `<span class="charger-tag ${item.charger === '???' ? 'warn' : ''}" title="Charger type">${escapeHtml(item.charger)}</span>` : ''}
          </div>

          <div class="item-right">
            <button type="button" data-popover-kind="item" data-popover-id="${item.id}" class="status-pill ${meta.cls}">
              <span class="dot-sm" style="background-color:${meta.dot};"></span>
              <span>${escapeHtml(meta.short)}</span>
            </button>
            <button type="button" data-delete-id="${item.id}" title="${item.list === 'base' ? 'Remove from Base List template' : 'Delete item'}" class="icon-del">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </li>
      `;
    }

    function bindChecklistEvents() {
      const trip = getActiveTrip();
      const allItems = getTripChecklistItems(trip);

      document.querySelectorAll('.scope-btn').forEach(btn => {
        btn.addEventListener('click', () => { ui.listScope = btn.dataset.scope; ui.categoryFilter = 'all'; render(); });
      });
      document.querySelectorAll('.status-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.statusFilter;
          ui.statusFilter = (ui.statusFilter === val && val !== 'all') ? 'all' : val;
          render();
        });
      });
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => { ui.categoryFilter = btn.dataset.cat; render(); });
      });

      const hideBtn = document.getElementById('toggleHideDontNeed');
      if (hideBtn) hideBtn.addEventListener('click', () => { ui.hideDontNeed = !ui.hideDontNeed; render(); });

      const sortBtn = document.getElementById('toggleSortStatus');
      if (sortBtn) sortBtn.addEventListener('click', () => { ui.sortByStatus = !ui.sortByStatus; render(); });

      const searchEl = document.getElementById('searchInput');
      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          const pos = e.target.selectionStart;
          ui.search = e.target.value;
          render();
          const newInput = document.getElementById('searchInput');
          if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
        });
      }

      const clearSearchBtn = document.getElementById('clearSearchBtn');
      if (clearSearchBtn) clearSearchBtn.addEventListener('click', () => { ui.search = ''; render(); });

      const clearFiltersBtn = document.getElementById('btnClearFilters');
      if (clearFiltersBtn) clearFiltersBtn.addEventListener('click', () => {
        ui.statusFilter = 'all'; ui.categoryFilter = 'all'; ui.search = ''; ui.hideDontNeed = false; render();
      });

      document.querySelectorAll('.collapse-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.dataset.collapse;
          ui.collapsedGroups[k] = !ui.collapsedGroups[k];
          render();
        });
      });

      document.querySelectorAll('.pack-all-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const list = btn.dataset.packAllList;
          const cat = btn.dataset.packAllCat;
          const prev = clone(store);
          let changed = 0;
          allItems.forEach(i => {
            if (i.list === list && i.category === cat && (i.status === 'Not Yet' || i.status === 'Packing Day Of')) {
              setItemStatus(i.id, 'Yes', trip);
              changed++;
            }
          });
          if (changed > 0) {
            saveStore(); render();
            showToast(`Marked ${changed} item${changed > 1 ? 's' : ''} in ${cat} as Packed`, () => { store = prev; saveStore(); render(); });
          }
        });
      });

      document.querySelectorAll('[data-toggle-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = allItems.find(i => i.id === btn.dataset.toggleId);
          if (!item) return;
          setItemStatus(item.id, item.status === 'Yes' ? 'Not Yet' : 'Yes', trip);
          saveStore(); render();
        });
      });

      document.querySelectorAll('[data-popover-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openStatusPopover(btn.dataset.popoverKind, btn.dataset.popoverId, btn);
        });
      });

      document.querySelectorAll('[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = allItems.find(i => i.id === btn.dataset.deleteId);
          if (!item) return;
          const prev = clone(store);
          deleteItem(item.id, trip);
          saveStore(); render();
          showToast(`Removed "${item.name}"${item.list === 'base' ? ' from Base List' : ''}`, () => { store = prev; saveStore(); render(); });
        });
      });

      document.querySelectorAll('[data-edit-id]').forEach(span => {
        span.addEventListener('dblclick', () => {
          const item = allItems.find(i => i.id === span.dataset.editId);
          if (!item) return;
          const input = document.createElement('input');
          input.type = 'text'; input.value = item.name; input.className = 'inline-edit';
          span.replaceWith(input);
          input.focus(); input.select();
          const commit = () => {
            const val = input.value.trim();
            if (val && val !== item.name) { renameItem(item.id, val, trip); saveStore(); }
            render();
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') input.blur();
            if (ev.key === 'Escape') render();
          });
        });
      });

      document.querySelectorAll('.quick-add-form').forEach(form => {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = form.querySelector('input').value.trim();
          if (!name) return;
          addItemToList(form.dataset.list, form.dataset.category, name, 'Not Yet', '', trip);
          saveStore(); render();
          showToast(`Added "${name}" to ${form.dataset.category}`);
        });
      });
    }

    // Unified Floating Status Popover (for Checklist items AND Outfit pieces)
    function openStatusPopover(kind, targetId, anchorEl) {
      const pop = document.getElementById('statusPopover');
      if (ui.openPopoverTarget && ui.openPopoverTarget.kind === kind && ui.openPopoverTarget.id === targetId && !pop.classList.contains('hidden')) {
        closePopover();
        return;
      }
      ui.openPopoverTarget = { kind, id: targetId };
      const trip = getActiveTrip();
      const checklistItems = getTripChecklistItems(trip);

      let currentStatus = 'Not Yet';
      if (kind === 'item') {
        const item = checklistItems.find(i => i.id === targetId);
        if (!item) return;
        currentStatus = item.status;
      } else {
        const found = getAllOutfitPieces(trip).find(e => e.piece.id === targetId);
        if (!found) return;
        currentStatus = getOutfitPieceStatus(found.piece, checklistItems);
      }

      pop.innerHTML = STATUSES.map(st => `
        <button type="button" data-pick-status="${escapeHtml(st.value)}" class="pop-opt" style="${currentStatus === st.value ? 'font-weight:600;' : ''}">
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="dot" style="background-color:${st.dot};"></span>
            <span>${escapeHtml(st.value)}</span>
          </span>
          ${currentStatus === st.value ? '<svg width="14" height="14" style="color:var(--primary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
        </button>
      `).join('');

      pop.classList.remove('hidden');
      const rect = anchorEl.getBoundingClientRect();
      const popW = 176;
      const popH = pop.offsetHeight || 190;
      let left = Math.max(8, Math.min(rect.right - popW, window.innerWidth - popW - 8));
      let top = rect.bottom + 6;
      if (top + popH > window.innerHeight - 8) top = Math.max(8, rect.top - popH - 6);
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;

      pop.querySelectorAll('[data-pick-status]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (kind === 'item') setItemStatus(targetId, btn.dataset.pickStatus, trip);
          else setOutfitPieceStatus(targetId, btn.dataset.pickStatus, trip);
          saveStore(); closePopover(); render();
        });
      });
    }

    function closePopover() {
      const pop = document.getElementById('statusPopover');
      if (pop) pop.classList.add('hidden');
      ui.openPopoverTarget = null;
    }

    // VIEW 2: CUSTOM PER-TRIP OUTFITS TAB (Replaces Trip Specific -> Clothing)
    function renderOutfitsView(container) {
      const trip = getActiveTrip();
      const checklistItems = getTripChecklistItems(trip);
      const uniquePieces = getUniqueOutfitEntries(trip);
      const stats = computeStats(uniquePieces);
      const yesPct = stats.required ? (stats.yes / stats.required) * 100 : 100;
      const dayOfPct = stats.required ? (stats.dayOf / stats.required) * 100 : 0;

      const statusChips = [
        { key: 'all', label: 'All', count: stats.total, dot: null },
        { key: 'Not Yet', label: 'To Pack', count: stats.notYet, dot: 'var(--error)' },
        { key: 'Packing Day Of', label: 'Day Of', count: stats.dayOf, dot: 'var(--warning)' },
        { key: 'Maybe', label: 'Maybe', count: stats.maybe, dot: 'var(--chart-1)' },
        { key: 'Yes', label: 'Packed', count: stats.yes, dot: 'var(--success)' },
        { key: "Don't Need", label: "Don't Need", count: stats.dontNeed, dot: 'var(--muted-foreground)' }
      ];

      container.innerHTML = `
        <div class="stack">
          <!-- Custom Outfits Readiness & Actions -->
          <section class="card card-padded" style="display:flex;flex-direction:column;gap:14px;">
            <div class="readiness-top">
              <div>
                <div class="readiness-label">${escapeHtml(trip.name)} · Custom Trip Outfits &amp; Clothing</div>
                <div class="readiness-metric">
                  <span class="readiness-pct">${stats.pct}%</span>
                  <span class="readiness-detail">
                    <strong>${stats.yes}</strong> of <strong>${stats.required}</strong> outfit pieces packed
                    ${stats.maybe > 0 ? `· ${stats.maybe} maybe` : ''}
                    · custom to this trip
                  </span>
                </div>
              </div>

              <div class="chip-wrap">
                <button id="btnAddDay" type="button" class="btn btn-primary">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  Add Day
                </button>
                <button id="btnAddSection" type="button" class="btn btn-secondary">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  Add Custom Section
                </button>
              </div>
            </div>

            <div class="progress-track">
              <div class="progress-seg" style="width:${yesPct.toFixed(1)}%;background-color:var(--success);"></div>
              <div class="progress-seg" style="width:${dayOfPct.toFixed(1)}%;background-color:var(--warning);"></div>
            </div>

            <div class="filter-row">
              <div class="chip-wrap">
                ${statusChips.map(ch => `
                  <button type="button" data-outfit-filter="${escapeHtml(ch.key)}" class="chip outfit-filter-btn ${ui.outfitStatusFilter === ch.key ? 'active' : ''}">
                    ${ch.dot ? `<span class="dot-sm" style="background-color:${ui.outfitStatusFilter === ch.key ? 'currentColor' : ch.dot};"></span>` : ''}
                    <span>${ch.label}</span>
                    <span class="tabular" style="opacity:0.75;">${ch.count}</span>
                  </button>
                `).join('')}
              </div>
              <span class="text-xs muted">Check items off right here — shoes/accessories auto-sync with your checklist.</span>
            </div>
          </section>

          <!-- Day & Custom Section Cards -->
          ${trip.outfits.length === 0 ? `
            <div class="card empty-state">
              <p style="margin:0 0 6px;font-weight:600;">No outfit days or sections yet for ${escapeHtml(trip.name)}</p>
              <p class="text-xs muted" style="margin:0 0 14px;">Add a day card (Daytime / Nighttime) or a custom section like "Work Looks" or "Dinner Outfits".</p>
            </div>
          ` : `
            <div class="grid-3">${trip.outfits.map(card => renderOutfitCard(card, checklistItems)).join('')}</div>
          `}
        </div>
      `;

      bindOutfitsEvents();
    }

    function renderOutfitPieceRow(cardId, slot, piece, checklistItems) {
      const linked = findLinkedChecklistItem(piece.name, checklistItems);
      const status = linked ? linked.status : (piece.status || 'Not Yet');
      if (ui.outfitStatusFilter !== 'all' && status !== ui.outfitStatusFilter) return '';

      const meta = getStatusMeta(status);
      const isPacked = status === 'Yes';
      const isSkipped = status === "Don't Need";

      return `
        <li class="outfit-piece ${isSkipped ? 'skipped' : ''}">
          <div class="item-left">
            <button type="button" data-outfit-check="${piece.id}" aria-label="Toggle packed status for ${escapeHtml(piece.name)}"
                    class="check-circle ${isPacked ? 'checked' : ''}">
              ${isPacked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
            </button>
            <span data-outfit-rename="${piece.id}" title="Double-click to rename"
                  class="item-name ${isSkipped ? 'skipped' : isPacked ? 'packed' : ''}">${escapeHtml(piece.name)}</span>
            ${linked ? `<span class="sync-tag" title="Synced with ${linked.list === 'base' ? 'Base List' : 'Trip Specific'} → ${escapeHtml(linked.category)}">${escapeHtml(linked.category)}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
            <button type="button" data-popover-kind="outfit" data-popover-id="${piece.id}" class="status-pill ${meta.cls}" style="padding:1px 8px;">
              <span class="dot-sm" style="background-color:${meta.dot};"></span><span>${escapeHtml(meta.short)}</span>
            </button>
            <button type="button" data-remove-piece-card="${cardId}" data-remove-piece-slot="${slot}" data-remove-piece-id="${piece.id}" title="Remove piece" class="icon-del" style="width:20px;height:20px;">&times;</button>
          </div>
        </li>
      `;
    }

    function renderOutfitSlot(cardId, slot, pieces, checklistItems, isCustomSection = false) {
      const isDay = slot === 'daytime';
      const renderedRows = pieces.map(p => renderOutfitPieceRow(cardId, slot, p, checklistItems)).filter(Boolean);
      const placeholder = isCustomSection ? 'Add outfit or clothing piece...' : `Add ${isDay ? 'daytime' : 'nighttime'} piece...`;

      return `
        <div class="slot-block">
          ${isCustomSection ? '' : `
            <div class="slot-head">
              <span class="slot-label">
                ${isDay
                  ? '<svg width="14" height="14" style="color:var(--warning);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
                  : '<svg width="14" height="14" style="color:var(--chart-1);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'}
                ${isDay ? 'Daytime' : 'Nighttime'}
              </span>
              <span class="text-xs muted tabular">${pieces.length}</span>
            </div>
          `}

          ${renderedRows.length === 0
            ? `<p class="text-xs muted" style="margin:2px 0;font-style:italic;">${pieces.length === 0 ? 'No pieces planned yet' : 'No pieces match filter'}</p>`
            : `<ul class="outfit-list">${renderedRows.join('')}</ul>`}

          <form class="outfit-add-form" data-card="${cardId}" data-slot="${slot}">
            <input type="text" class="outfit-add-input" placeholder="${placeholder}" />
            <button type="submit" class="link-btn">Add</button>
          </form>
        </div>
      `;
    }

    function renderOutfitCard(card, checklistItems) {
      const isSection = card.type === 'section';
      const cardPieces = isSection ? (card.items || []) : [...(card.daytime || []), ...(card.nighttime || [])];
      const cardStats = computeStats(cardPieces.map(p => ({ status: getOutfitPieceStatus(p, checklistItems) })));

      return `
        <article class="card">
          <div class="cat-header">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
              <h3 data-day-title="${card.id}" class="day-title" contenteditable="true" spellcheck="false" title="Click to rename"
                  style="margin:0;font-size:14px;font-weight:600;outline:none;border-radius:6px;padding:0 4px;margin-left:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${escapeHtml(card.label)}
              </h3>
              ${isSection ? '<span class="list-tag">Custom</span>' : ''}
            </div>
            <div class="cat-header-right">
              ${cardStats.remaining > 0 ? `<button type="button" data-pack-card="${card.id}" class="pack-all-btn" title="Mark all pieces here as Packed">Pack all</button>` : ''}
              <span class="cat-count">${cardStats.yes}/${cardStats.required}</span>
              <button type="button" data-delete-day="${card.id}" class="pack-all-btn" title="Remove card">&times;</button>
            </div>
          </div>
          <div class="progress-thin">
            <div class="progress-seg" style="width:${cardStats.required ? cardStats.pct : 0}%;background-color:var(--success);"></div>
          </div>
          <div>
            ${isSection
              ? renderOutfitSlot(card.id, 'items', card.items || [], checklistItems, true)
              : renderOutfitSlot(card.id, 'daytime', card.daytime || [], checklistItems, false) +
                renderOutfitSlot(card.id, 'nighttime', card.nighttime || [], checklistItems, false)}
          </div>
        </article>
      `;
    }

    function bindOutfitsEvents() {
      const trip = getActiveTrip();
      const checklistItems = getTripChecklistItems(trip);

      document.querySelectorAll('.outfit-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.outfitFilter;
          ui.outfitStatusFilter = (ui.outfitStatusFilter === val && val !== 'all') ? 'all' : val;
          render();
        });
      });

      const btnAddDay = document.getElementById('btnAddDay');
      if (btnAddDay) {
        btnAddDay.addEventListener('click', () => {
          const dayCount = trip.outfits.filter(c => c.type !== 'section').length;
          trip.outfits.push({ id: `day-${Date.now()}`, type: 'day', label: `Day ${dayCount + 1}`, daytime: [], nighttime: [] });
          saveStore(); render();
        });
      }

      const btnAddSection = document.getElementById('btnAddSection');
      if (btnAddSection) {
        btnAddSection.addEventListener('click', openAddOutfitSectionModal);
      }

      document.querySelectorAll('[data-day-title]').forEach(el => {
        el.addEventListener('blur', () => {
          const card = trip.outfits.find(d => d.id === el.dataset.dayTitle);
          const val = el.textContent.trim();
          if (card && val && val !== card.label) { card.label = val; saveStore(); }
        });
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      });

      document.querySelectorAll('[data-pack-card]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = trip.outfits.find(c => c.id === btn.dataset.packCard);
          if (!card) return;
          const prev = clone(store);
          const pieces = card.type === 'section' ? (card.items || []) : [...(card.daytime || []), ...(card.nighttime || [])];
          let changed = 0;
          pieces.forEach(p => {
            const st = getOutfitPieceStatus(p, getTripChecklistItems(trip));
            if (st === 'Not Yet' || st === 'Packing Day Of') {
              setOutfitPieceStatus(p.id, 'Yes', trip);
              changed++;
            }
          });
          if (changed > 0) {
            saveStore(); render();
            showToast(`Packed ${changed} piece${changed > 1 ? 's' : ''} in ${card.label}`, () => { store = prev; saveStore(); render(); });
          }
        });
      });

      document.querySelectorAll('[data-delete-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = trip.outfits.find(d => d.id === btn.dataset.deleteDay);
          if (!card) return;
          const prev = clone(store);
          trip.outfits = trip.outfits.filter(d => d.id !== card.id);
          saveStore(); render();
          showToast(`Removed "${card.label}"`, () => { store = prev; saveStore(); render(); });
        });
      });

      document.querySelectorAll('.outfit-add-form').forEach(form => {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = form.querySelector('input').value.trim();
          if (!val) return;
          const card = trip.outfits.find(d => d.id === form.dataset.card);
          if (!card) return;
          const slot = form.dataset.slot;
          if (!Array.isArray(card[slot])) card[slot] = [];
          // Inherit status if another outfit slot or checklist item already tracks this piece
          const linked = findLinkedChecklistItem(val, checklistItems);
          const existingSame = getAllOutfitPieces(trip).find(e => normalizeText(e.piece.name) === normalizeText(val));
          const initialStatus = linked ? linked.status : existingSame ? existingSame.piece.status : 'Not Yet';
          card[slot].push(makePiece(val, initialStatus));
          saveStore(); render();
        });
      });

      document.querySelectorAll('[data-outfit-check]').forEach(btn => {
        btn.addEventListener('click', () => {
          const found = getAllOutfitPieces(trip).find(e => e.piece.id === btn.dataset.outfitCheck);
          if (!found) return;
          const cur = getOutfitPieceStatus(found.piece, checklistItems);
          setOutfitPieceStatus(found.piece.id, cur === 'Yes' ? 'Not Yet' : 'Yes', trip);
          saveStore(); render();
        });
      });

      document.querySelectorAll('[data-popover-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openStatusPopover(btn.dataset.popoverKind, btn.dataset.popoverId, btn);
        });
      });

      document.querySelectorAll('[data-outfit-rename]').forEach(span => {
        span.addEventListener('dblclick', () => {
          const found = getAllOutfitPieces(trip).find(e => e.piece.id === span.dataset.outfitRename);
          if (!found) return;
          const input = document.createElement('input');
          input.type = 'text'; input.value = found.piece.name; input.className = 'inline-edit';
          span.replaceWith(input);
          input.focus(); input.select();
          const commit = () => {
            const val = input.value.trim();
            if (val && val !== found.piece.name) { found.piece.name = val; saveStore(); }
            render();
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') input.blur();
            if (ev.key === 'Escape') render();
          });
        });
      });

      document.querySelectorAll('[data-remove-piece-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = trip.outfits.find(d => d.id === btn.dataset.removePieceCard);
          if (!card) return;
          const slot = btn.dataset.removePieceSlot;
          const id = btn.dataset.removePieceId;
          const target = (card[slot] || []).find(p => p.id === id);
          if (!target) return;
          const prev = clone(store);
          card[slot] = card[slot].filter(p => p.id !== id);
          saveStore(); render();
          showToast(`Removed "${target.name}" from ${card.label}`, () => { store = prev; saveStore(); render(); });
        });
      });
    }
